<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>배당 일정 조회</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="title-row">
        <h1>배당 일정 조회</h1>
        <button id="settingsBtn" class="icon-btn hidden" type="button" aria-label="설정">⚙︎</button>
      </div>
      <p class="muted">SEIBro(한국예탁결제원) 배당정보로 배당기준일·지급일·주당배당금을 확인합니다.</p>
      <div id="demoBanner" class="banner hidden"></div>
      <form id="settings" class="settings hidden">
        <label for="keyInput"><b>공공데이터포털 서비스키</b></label>
        <p class="muted">data.go.kr에서 「금융위원회_주식배당정보」를 활용신청한 뒤 받은 <b>일반 인증키</b>를 붙여넣으세요. 키는 이 기기에만 저장됩니다.</p>
        <div class="search">
          <input id="keyInput" type="text" placeholder="서비스키" autocomplete="off" autocapitalize="off" spellcheck="false" />
          <button type="submit">저장</button>
        </div>
        <button id="keyClear" class="link-btn" type="button">지우기 (데모 모드)</button>
      </form>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="stock" role="tab">종목으로 찾기</button>
      <button class="tab" data-tab="date" role="tab">공시일로 찾기</button>
    </nav>

    <form id="stockForm" class="search">
      <input id="q" type="search" placeholder="회사명, 종목코드(005930) 또는 ISIN" autocomplete="off" required />
      <button type="submit">조회</button>
    </form>
    <form id="dateForm" class="search hidden">
      <input id="date" type="date" required />
      <button type="submit">조회</button>
    </form>
    <div id="recent" class="chips"></div>

    <p id="status" class="status" aria-live="polite"></p>

    <section id="upcomingWrap" class="hidden">
      <h2>다가오는 일정</h2>
      <ul id="upcoming" class="events"></ul>
    </section>

    <section id="results"></section>

    <footer class="muted foot">
      데이터: 한국예탁결제원 SEIBro · 공공데이터포털 「금융위원회_주식배당정보」 (하루 1회 갱신).
      투자 판단 전 반드시 공시 원문을 확인하세요.
    </footer>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
